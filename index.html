<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKPD Digital Interaktif</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">

    <div class="max-w-4xl mx-auto my-8 p-4 sm:p-6 bg-white rounded-2xl shadow-xl border border-slate-200">
        
        <!-- HEADER LKPD -->
        <header class="border-b border-slate-200 pb-5 mb-6 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <span class="inline-block px-3 py-1 bg-blue-100 text-blue-700 font-semibold text-xs rounded-full mb-2">LKPD Digital Informatik</span>
                <h1 id="lkpd-active-title" class="text-xl sm:text-2xl font-bold text-slate-900">Memuat LKPD...</h1>
            </div>
            <button onclick="submitLKPD()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs sm:text-sm px-5 py-2.5 rounded-xl shadow-md transition-all flex items-center gap-2">
                <i class="fa-solid fa-paper-plane"></i>
                <span>Simpan & Kumpulkan</span>
            </button>
        </header>

        <!-- AREA KONTEN LKPD (DYNAMICALLY RENDERED BY JS) -->
        <main id="lkpd-content-area" class="space-y-6">
            <!-- Konten Zone 1, 2, dan 3 akan dirender otomatis melalui JavaScript -->
        </main>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        let activeLKPDIndex = 0;

        // DATABASE LKPD (DAPAT DITAMBAH ATAU DISUAIKAN MATERINYA)
        let lkpdDatabase = [
            {
                id: 1,
                judul: "Pencarian Data (Searching) & Algoritma",
                
                // ZONE 1: PENAMBAHAN MATERI SINGKAT & KATA AKSI UNTUK KURIKULUM MERDEKA
                zone1_mindful: {
                    materi_singkat: "Algoritma Pencarian (Searching) adalah proses menemukan data tertentu di dalam sekumpulan data. Pencarian pada data yang terstruktur/terurut jauh lebih cepat dibandingkan data acak (Unsorted).",
                    instruksi: "Hening sejenak, tarik napas dalam-dalam, lalu cermati dua pengalaman mencari barang berikut sebelum masuk ke materi.",
                    poin_kesadaran: [
                        "Amati proses mencari satu kontak teman di ponsel yang daftarnya tersusun rapi secara alfabetis.",
                        "Cermati proses mencari kunci motor di dalam tas besar yang berisi tumpukan barang acak-acakan.",
                        "Bandingkan perbedaan efisiensi waktu, fokus pikiran, dan jumlah energi yang dikeluarkan pada kedua kondisi tersebut."
                    ]
                },

                // ZONE 2: STIMULUS STUDI KASUS (BISA DITAMBAH APLIKASI SOALNYA)
                zone2_meaningful: {
                    skenario_kasus: "Di perpustakaan sekolah, terdapat 1.000 buku yang belum dikelompokkan dan disebar acak di meja. Siswa diminta menemukan buku 'Informatika Kelas 9' dalam waktu 2 menit.",
                    kegiatan: [
                        {
                            tipe: "pilihan_pemecahan",
                            pertanyaan: "Pilihlah 3 langkah paling efisien untuk menemukan buku tersebut!",
                            opsi_pilihan: [
                                "Periksa daftar rak katalog berdasarkan kategori subjek",
                                "Urutkan buku secara alfabetis terlebih dahulu sebelum dicari",
                                "Gunakan metode pencarian bagi dua (Binary Search) jika data terurut",
                                "Cari satu per satu dari tumpukan paling bawah secara acak",
                                "Tanyakan kepada pengunjung lain tanpa melihat rak",
                                "Biarkan buku menumpuk dan tebak posisinya"
                            ],
                            kunci_jawaban: [0, 1, 2]
                        }
                    ]
                },

                // ZONE 3: DUKUNGAN 10 SOAL BERBENTUK ARRAY (MENCEGAH 'UNDEFINED')
                zone3_joyful: {
                    soal_reflektif: [
                        {
                            id: 1,
                            pertanyaan: "1. Metode pencarian yang memeriksa data satu per satu dari awal sampai akhir disebut...",
                            pilihan: ["A. Sequential Search", "B. Binary Search", "C. Bubble Sort", "D. Quick Sort"],
                            jawaban_benar: "A."
                        },
                        {
                            id: 2,
                            pertanyaan: "2. Syarat utama agar pencarian biner (Binary Search) dapat dilakukan adalah...",
                            pilihan: ["A. Data harus bernilai angka", "B. Data harus dalam keadaan terurut", "C. Data jumlahnya harus genap", "D. Data disimpan di cloud"],
                            jawaban_benar: "B."
                        },
                        {
                            id: 3,
                            pertanyaan: "3. Manakah contoh penerapan Sequential Search dalam kehidupan sehari-hari?",
                            pilihan: ["A. Mencari kata di kamus terurut", "B. Mencari nama di buku telepon", "C. Mencari baju hitam di lemari yang berantakan", "D. Mencari halaman bab di daftar isi"],
                            jawaban_benar: "C."
                        },
                        {
                            id: 4,
                            pertanyaan: "4. Jika ada 8 data terurut, berapa jumlah maksimal percobaan pada Binary Search?",
                            pilihan: ["A. 8 kali", "B. 3 kali", "C. 1 kali", "D. 16 kali"],
                            jawaban_benar: "B."
                        },
                        {
                            id: 5,
                            pertanyaan: "5. Keuntungan utama dari struktur data yang terorganisir adalah...",
                            pilihan: ["A. Mempercepat proses pencarian", "B. Memperbesar ukuran memori", "C. Memperluas layar komputer", "D. Menghapus data otomatis"],
                            jawaban_benar: "A."
                        },
                        {
                            id: 6,
                            pertanyaan: "6. Karakteristik utama dari algoritma pencarian biner adalah...",
                            pilihan: ["A. Membagi data menjadi dua bagian setiap langkah", "B. Mengulang data dari akhir ke awal", "C. Menghapus data acak", "D. Mengganti isi data"],
                            jawaban_benar: "A."
                        },
                        {
                            id: 7,
                            pertanyaan: "7. Apa yang terjadi jika Binary Search diterapkan pada data yang tidak terurut?",
                            pilihan: ["A. Hasil pencarian bisa salah/tidak ditemukan", "B. Proses pencarian makin cepat", "C. Komputer akan mengalami crash", "D. Data otomatis terurut sendiri"],
                            jawaban_benar: "A."
                        },
                        {
                            id: 8,
                            pertanyaan: "8. Istilah 'Unsorted Data' dalam algoritma berarti...",
                            pilihan: ["A. Data terurut", "B. Data tidak terurut / acak", "C. Data hilang", "D. Data ganda"],
                            jawaban_benar: "B."
                        },
                        {
                            id: 9,
                            pertanyaan: "9. Di antara pilihan berikut, manakah skenario yang paling lambat jika menggunakan Sequential Search?",
                            pilihan: ["A. Data yang dicari ada di urutan pertama", "B. Data yang dicari ada di tengah", "C. Data yang dicari ada di posisi paling akhir", "D. Data tidak dicari"],
                            jawaban_benar: "C."
                        },
                        {
                            id: 10,
                            pertanyaan: "10. Mengapa penyusunan daftar kontak secara alfabetis mempermudah pencarian?",
                            pilihan: ["A. Karena menerapkan prinsip data terstruktur", "B. Karena kontak menjadi lebih sedikit", "C. Karena warna tulisan berubah", "D. Karena ponsel tidak panas"],
                            jawaban_benar: "A."
                        }
                    ],
                    refleksi_diri: {
                        pilihan_emosi: [
                            "Sangat Paham — Saya mengerti perbedaan Sequential & Binary Search.",
                            "Cukup Paham — Saya perlu latihan soal lebih lanjut.",
                            "Masih Bingung — Saya butuh bimbingan ulang dari guru."
                        ],
                        pesan_untuk_guru: "Tuliskan pesan atau catatan kamu di sini..."
                    }
                }
            }
        ];

        // FUNGSI UNTUK MERENDER KONTEN KE HALAMAN
        function renderActiveLKPD() {
            const lkpd = lkpdDatabase[activeLKPDIndex];
            if (!lkpd) return;

            document.getElementById('lkpd-active-title').innerText = lkpd.judul;
            const container = document.getElementById('lkpd-content-area');
            container.innerHTML = "";

            // --- ZONE 1: MINDFUL LEARNING ---
            if (lkpd.zone1_mindful) {
                const z1 = document.createElement('div');
                z1.className = "bg-blue-50/70 border-l-4 border-blue-600 p-5 rounded-r-xl space-y-3";
                
                let poinHtml = (lkpd.zone1_mindful.poin_kesadaran || []).map(p => `<li class="text-xs sm:text-sm text-blue-950 font-medium">${p}</li>`).join('');

                z1.innerHTML = `
                    <div class="flex items-center space-x-2 text-blue-900 font-bold text-sm sm:text-base">
                        <i class="fa-solid fa-brain text-blue-600"></i>
                        <span>ZONE 1: MINDFUL LEARNING (Fokus & Kesadaran Belajar)</span>
                    </div>
                    ${lkpd.zone1_mindful.materi_singkat ? `
                        <div class="bg-white p-4 rounded-lg border border-blue-200 text-xs sm:text-sm text-slate-700 leading-relaxed shadow-sm">
                            <strong class="text-blue-900 block font-bold mb-1"><i class="fa-solid fa-book-open text-blue-600 mr-1"></i> Materi Pembelajaran:</strong>
                            ${lkpd.zone1_mindful.materi_singkat}
                        </div>
                    ` : ''}
                    <p class="text-xs sm:text-sm text-blue-900 leading-relaxed font-semibold">${lkpd.zone1_mindful.instruksi || ""}</p>
                    <ul class="list-disc list-inside space-y-1.5 bg-white p-4 rounded-lg border border-blue-100 shadow-sm">
                        ${poinHtml}
                    </ul>
                `;
                container.appendChild(z1);
            }

            // --- ZONE 2: MEANINGFUL LEARNING ---
            if (lkpd.zone2_meaningful) {
                const z2 = document.createElement('div');
                z2.className = "bg-amber-50/70 border-l-4 border-amber-500 p-5 rounded-r-xl space-y-4";
                
                let kegiatanHtml = "";
                if (lkpd.zone2_meaningful.kegiatan) {
                    lkpd.zone2_meaningful.kegiatan.forEach((keg, kIdx) => {
                        if (keg.tipe === "pilihan_pemecahan") {
                            const opsiHtml = (keg.opsi_pilihan || []).map((o, oIdx) => `
                                <label class="flex items-start space-x-2.5 p-3 bg-white rounded-lg border border-slate-200 hover:bg-amber-50 cursor-pointer text-xs sm:text-sm transition-colors shadow-sm">
                                    <input type="checkbox" name="z2_keg_${kIdx}" value="${oIdx}" class="mt-0.5 rounded text-amber-600 focus:ring-amber-500">
                                    <span class="text-slate-800">${o}</span>
                                </label>
                            `).join('');

                            kegiatanHtml += `
                                <div class="space-y-2">
                                    <h4 class="font-bold text-xs sm:text-sm text-slate-800">${kIdx + 1}. ${keg.pertanyaan}</h4>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">${opsiHtml}</div>
                                </div>
                            `;
                        }
                    });
                }

                z2.innerHTML = `
                    <div class="flex items-center space-x-2 text-amber-900 font-bold text-sm sm:text-base">
                        <i class="fa-solid fa-puzzle-piece text-amber-600"></i>
                        <span>ZONE 2: MEANINGFUL LEARNING (Aktivitas Studi Kasus)</span>
                    </div>
                    <div class="bg-white p-4 rounded-xl border border-amber-200 text-xs sm:text-sm text-slate-700 leading-relaxed space-y-1 shadow-sm">
                        <strong class="text-amber-900 block font-bold">Studi Kasus / Deskripsi Masalah:</strong>
                        <p>${lkpd.zone2_meaningful.skenario_kasus || ""}</p>
                    </div>
                    <div class="space-y-4">${kegiatanHtml}</div>
                `;
                container.appendChild(z2);
            }

            // --- ZONE 3: JOYFUL LEARNING ---
            if (lkpd.zone3_joyful) {
                const z3 = document.createElement('div');
                z3.className = "bg-emerald-50/70 border-l-4 border-emerald-500 p-5 rounded-r-xl space-y-4";
                
                let daftarSoalHtml = "";
                const soalList = Array.isArray(lkpd.zone3_joyful.soal_reflektif) 
                    ? lkpd.zone3_joyful.soal_reflektif 
                    : [lkpd.zone3_joyful.soal_reflektif];

                soalList.forEach((soalObj, sIdx) => {
                    if (!soalObj || !soalObj.pertanyaan) return;

                    let pilihanHtml = (soalObj.pilihan || []).map((p) => `
                        <label class="flex items-center space-x-2 p-2.5 bg-white rounded-lg border border-slate-200 hover:bg-emerald-50 cursor-pointer text-xs sm:text-sm transition-colors shadow-sm">
                            <input type="radio" name="z3_soal_${sIdx}" value="${p.substring(0, 2)}" class="text-emerald-600 focus:ring-emerald-500">
                            <span class="text-slate-800">${p}</span>
                        </label>
                    `).join('');

                    daftarSoalHtml += `
                        <div class="bg-white p-4 rounded-xl border border-emerald-200 space-y-2 mb-3 shadow-sm">
                            <h4 class="font-bold text-xs sm:text-sm text-slate-800">${soalObj.pertanyaan}</h4>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${pilihanHtml}</div>
                        </div>
                    `;
                });

                let emosiHtml = "";
                if (lkpd.zone3_joyful.refleksi_diri && lkpd.zone3_joyful.refleksi_diri.pilihan_emosi) {
                    emosiHtml = lkpd.zone3_joyful.refleksi_diri.pilihan_emosi.map(e => `
                        <label class="flex items-center space-x-2 p-2.5 bg-white rounded-lg border border-slate-200 hover:bg-emerald-50 cursor-pointer text-xs sm:text-sm shadow-sm">
                            <input type="radio" name="z3_emotions" class="text-emerald-600 focus:ring-emerald-500">
                            <span class="text-slate-800">${e}</span>
                        </label>
                    `).join('');
                }

                z3.innerHTML = `
                    <div class="flex items-center space-x-2 text-emerald-900 font-bold text-sm sm:text-base mb-2">
                        <i class="fa-solid fa-face-smile text-emerald-600"></i>
                        <span>ZONE 3: JOYFUL LEARNING (Uji Pemahaman & Refleksi Diri)</span>
                    </div>

                    <div class="space-y-3">${daftarSoalHtml}</div>

                    <div class="space-y-3 pt-3 border-t border-emerald-200">
                        <h4 class="font-bold text-xs sm:text-sm text-emerald-900">Refleksi Perasaan & Pemahaman Belajar Hari Ini:</h4>
                        <div class="space-y-2">${emosiHtml}</div>
                        <div class="pt-2">
                            <label class="block text-xs sm:text-sm font-bold text-slate-700 mb-1">Pesan / Catatan untuk Guru:</label>
                            <input type="text" placeholder="${lkpd.zone3_joyful.refleksi_diri ? lkpd.zone3_joyful.refleksi_diri.pesan_untuk_guru : ''}" class="w-full p-2.5 border border-slate-300 rounded-lg text-xs sm:text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                    </div>
                `;
                container.appendChild(z3);
            }
        }

        // FUNGSI SUBMIT & EVALUASI OTOMATIS
        function submitLKPD() {
            const lkpd = lkpdDatabase[activeLKPDIndex];
            if (!lkpd) return;

            let totalSoal = 0;
            let benar = 0;

            const soalList = Array.isArray(lkpd.zone3_joyful.soal_reflektif) 
                ? lkpd.zone3_joyful.soal_reflektif 
                : [lkpd.zone3_joyful.soal_reflektif];

            soalList.forEach((soalObj, sIdx) => {
                if (!soalObj) return;
                const radios = document.querySelectorAll(`input[name="z3_soal_${sIdx}"]`);
                if (radios.length > 0) totalSoal++;

                radios.forEach((radio) => {
                    const label = radio.closest('label');
                    const isCorrect = radio.value.trim() === soalObj.jawaban_benar;

                    if (radio.checked) {
                        if (isCorrect) {
                            label.classList.add('bg-green-100', 'border-green-500', 'text-green-800', 'font-bold');
                            label.classList.remove('bg-white');
                            benar++;
                        } else {
                            label.classList.add('bg-red-100', 'border-red-500', 'text-red-800', 'font-bold');
                            label.classList.remove('bg-white');
                        }
                    } else if (isCorrect) {
                        label.classList.add('border-green-400', 'bg-green-50');
                    }
                });
            });

            alert(`LKPD Berhasil Disimpan!\nHasil Evaluasi Pilihan Ganda: ${benar} dari ${totalSoal} soal dijawab dengan benar.`);
        }

        // EXECUTE INITIAL RENDER
        document.addEventListener("DOMContentLoaded", () => {
            renderActiveLKPD();
        });
    </script>
</body>
</html>
